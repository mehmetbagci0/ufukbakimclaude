<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ufuk Bakım – Asansör Bakım Sistemi</title>
  <style>
    :root {
      --bg: #f0f4ff;
      --card: #ffffff;
      --primary: #1a56db;
      --primary-dark: #0f2f69;
      --primary-light: #e8efff;
      --text: #10233f;
      --muted: #5a6b87;
      --success: #16a34a;
      --success-dark: #166534;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --border: #d1daf0;
      --shadow-sm: 0 1px 4px rgba(15,47,105,.10);
      --shadow-md: 0 4px 16px rgba(15,47,105,.13);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100dvh;
    }

    .hidden { display: none !important; }

    /* ── Login ─────────────────────────────────────── */
    #loginView {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg, #0f2f69 0%, #1a56db 100%);
    }

    .login-card {
      background: var(--card);
      border-radius: 20px;
      padding: 36px 28px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-md);
    }

    .login-icon {
      font-size: 52px;
      text-align: center;
      line-height: 1;
      margin-bottom: 12px;
    }

    .login-title {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .login-sub {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    /* ── Topbar ────────────────────────────────────── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(90deg, #0f2f69 0%, #1a56db 100%);
      color: #fff;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(15,47,105,.25);
    }

    .topbar-left { display: flex; align-items: center; gap: 10px; }

    .topbar-icon { font-size: 24px; line-height: 1; }

    .topbar-title { font-size: 18px; font-weight: 700; }

    .topbar-sub { font-size: 13px; opacity: .75; }

    /* ── Container ─────────────────────────────────── */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ── Cards ─────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
    h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    p { margin: 5px 0; }

    .muted { color: var(--muted); font-size: 14px; }

    /* ── Form elements ─────────────────────────────── */
    .field { margin-bottom: 12px; }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, select, textarea {
      font-size: 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      min-height: 48px;
      width: 100%;
      padding: 10px 14px;
      background: #fff;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,86,219,.15);
    }

    textarea { min-height: 88px; resize: vertical; }

    /* ── Buttons ───────────────────────────────────── */
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1.5px solid transparent;
      min-height: 48px;
      padding: 10px 18px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .2s, box-shadow .2s, transform .1s;
      background: var(--primary);
      color: #fff;
    }

    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(.98); }

    button.btn-success {
      background: var(--success);
      border-color: var(--success);
    }
    button.btn-success:hover { background: var(--success-dark); }

    button.secondary {
      background: #fff;
      color: var(--primary);
      border-color: var(--border);
    }
    button.secondary:hover { background: var(--primary-light); border-color: var(--primary); }

    button.btn-edit {
      background: #f1f5f9;
      color: #475569;
      border-color: #cbd5e1;
    }
    button.btn-edit:hover { background: #e2e8f0; }

    button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    button.danger:hover { background: #b91c1c; }

    button.topbar-btn {
      background: rgba(255,255,255,.15);
      border-color: rgba(255,255,255,.35);
      color: #fff;
      min-height: 40px;
      width: auto;
      padding: 8px 16px;
      font-size: 14px;
    }
    button.topbar-btn:hover { background: rgba(255,255,255,.28); }

    /* ── Row ───────────────────────────────────────── */
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .row > button { width: auto; flex: 1; min-width: 100px; }

    /* ── Tabs ──────────────────────────────────────── */
    .tabs-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 14px;
      padding-bottom: 2px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      min-width: max-content;
    }

    .tab-btn {
      background: transparent;
      color: rgba(255,255,255,.7);
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      min-height: 44px;
      padding: 10px 18px;
      font-size: 14px;
      width: auto;
      white-space: nowrap;
      transition: color .2s, border-color .2s;
    }

    .tab-btn:hover { color: #fff; background: transparent; }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: #fff;
      font-weight: 700;
      background: transparent;
    }

    .tabs-bar {
      background: linear-gradient(90deg, #0f2f69 0%, #1a56db 100%);
      padding: 0 16px;
      position: sticky;
      top: 58px;
      z-index: 90;
      box-shadow: 0 2px 6px rgba(15,47,105,.18);
    }

    /* ── Password wrap ─────────────────────────────── */
    .password-wrap { display: flex; gap: 8px; }
    .password-wrap input { flex: 1; }
    .password-wrap .toggle-pass {
      width: auto;
      min-width: 72px;
      padding: 10px 12px;
      font-size: 14px;
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--border);
    }
    .password-wrap .toggle-pass:hover { background: #d1e0ff; }

    /* ── List / Item ───────────────────────────────── */
    .list { display: grid; gap: 10px; }

    .item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      background: #fff;
      transition: box-shadow .2s;
    }

    .item:hover { box-shadow: var(--shadow-sm); }
    .item .title { font-weight: 700; margin-bottom: 4px; }

    /* ── Pill ──────────────────────────────────────── */
    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── Warn ──────────────────────────────────────── */
    .warn {
      color: var(--danger);
      font-weight: 600;
      background: var(--danger-bg);
      border: 1px solid #fca5a5;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
    }

    /* ── Grid ──────────────────────────────────────── */
    @media (min-width: 560px) {
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    }

    /* ── Worker panel ──────────────────────────────── */
    .welcome-bar {
      padding: 16px;
      background: var(--primary-light);
      border-radius: var(--radius);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .welcome-icon { font-size: 28px; }

    .welcome-name { font-size: 17px; font-weight: 700; color: var(--primary-dark); }

    /* ── Search box ────────────────────────────────── */
    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      pointer-events: none;
      color: var(--muted);
    }

    #buildingSearch {
      min-height: 52px;
      padding-left: 46px;
      padding-right: 40px;
      font-size: 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
    }

    #buildingSearch:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(26,86,219,.15);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      min-height: unset;
      width: auto;
      padding: 4px 6px;
      cursor: pointer;
      line-height: 1;
    }
    .search-clear:hover { color: var(--danger); background: none; }

    /* ── Group grid ────────────────────────────────── */
    .group-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 640px) {
      .group-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .group-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, background .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .group-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
      background: var(--primary-light);
    }

    .group-card-icon { font-size: 28px; line-height: 1; }
    .group-card-name { font-weight: 700; font-size: 15px; }
    .group-card-count { font-size: 13px; color: var(--muted); }

    /* ── Building card ─────────────────────────────── */
    .building-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s;
    }

    .building-card:hover { box-shadow: var(--shadow-md); }

    .building-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .building-card-name { font-weight: 700; font-size: 16px; }

    .building-card-addr {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .building-card-addr-icon { flex-shrink: 0; }

    .no-results {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 16px;
    }

    /* ── Back button ───────────────────────────────── */
    .back-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .back-row button { width: auto; }

    /* ── Utility ───────────────────────────────────── */
    .mt-8 { margin-top: 8px; }
    .mt-14 { margin-top: 14px; }
    .mt-4 { margin-top: 4px; }
    .btn-login {
      background: linear-gradient(90deg, #0f2f69, #1a56db);
      border: none;
      margin-top: 4px;
    }
    .btn-login:hover { background: linear-gradient(90deg, #0a1f47, #1245b8); }
    .warn-mt { margin-top: 12px; }
    .back-pill { font-size: 14px; }
    .back-btn { min-width: 80px; }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <section id="loginView">
    <div class="login-card">
      <div class="login-icon">🛗</div>
      <div class="login-title">Ufuk Bakım</div>
      <div class="login-sub">Asansör Bakım Sistemi</div>

      <div class="field">
        <label for="loginUsername">Kullanıcı Adı</label>
        <input id="loginUsername" autocomplete="username" placeholder="Kullanıcı adınızı girin" />
      </div>
      <div class="field">
        <label for="loginPassword">Şifre</label>
        <div class="password-wrap">
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
          <button type="button" class="toggle-pass" data-target="loginPassword">Göster</button>
        </div>
      </div>
      <button id="loginBtn" type="button" class="btn-login">Giriş Yap →</button>
      <p id="loginError" class="warn hidden warn-mt" aria-live="polite"></p>
    </div>
  </section>

  <!-- ADMIN VIEW -->
  <section id="adminView" class="hidden">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-icon">🛗</span>
        <div>
          <div class="topbar-title">Ufuk Bakım</div>
          <div class="topbar-sub">Admin Paneli</div>
        </div>
      </div>
      <button id="logoutAdmin" class="topbar-btn" type="button">Çıkış</button>
    </div>

    <div class="tabs-bar">
      <div class="tabs-wrap">
        <div class="tabs">
          <button class="tab-btn active" data-tab="groupsTab" type="button">Gruplar</button>
          <button class="tab-btn" data-tab="buildingsTab" type="button">Binalar</button>
          <button class="tab-btn" data-tab="workersTab" type="button">Elemanlar</button>
          <button class="tab-btn" data-tab="settingsTab" type="button">Ayarlar</button>
        </div>
      </div>
    </div>

    <div class="container">
      <div id="groupsTab" class="card tab-panel">
        <h2>Gruplar</h2>
        <div class="field">
          <label for="groupName">Grup Adı</label>
          <input id="groupName" placeholder="Örn: 3. Bölge" />
        </div>
        <div class="row">
          <button id="saveGroupBtn" type="button">Grup Ekle</button>
          <button id="cancelGroupEdit" type="button" class="secondary hidden">İptal</button>
        </div>
        <div id="groupsList" class="list mt-14"></div>
      </div>

      <div id="buildingsTab" class="card tab-panel hidden">
        <h2>Binalar</h2>
        <div class="field">
          <label for="buildingFilter">Gruba Göre Filtre</label>
          <select id="buildingFilter"></select>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="buildingName">Bina Adı</label>
            <input id="buildingName" placeholder="Örn: Yıldız Apartmanı" />
          </div>
          <div class="field">
            <label for="buildingGroup">Grup</label>
            <select id="buildingGroup"></select>
          </div>
        </div>
        <div class="field">
          <label for="buildingAddress">Adres</label>
          <textarea id="buildingAddress" placeholder="Açık adres girin"></textarea>
        </div>
        <div class="row">
          <button id="saveBuildingBtn" class="btn-success" type="button">Bina Ekle</button>
          <button id="cancelBuildingEdit" type="button" class="secondary hidden">İptal</button>
        </div>
        <div id="buildingsList" class="list mt-14"></div>
      </div>

      <div id="workersTab" class="card tab-panel hidden">
        <h2>Elemanlar</h2>
        <div class="grid-2">
          <div class="field">
            <label for="workerName">Ad Soyad</label>
            <input id="workerName" placeholder="Ad Soyad" />
          </div>
          <div class="field">
            <label for="workerUsername">Kullanıcı Adı</label>
            <input id="workerUsername" autocomplete="off" placeholder="kullanici_adi" />
          </div>
        </div>
        <div class="field">
          <label for="workerPassword">Şifre</label>
          <div class="password-wrap">
            <input id="workerPassword" type="password" autocomplete="new-password" placeholder="••••••••" />
            <button type="button" class="toggle-pass" data-target="workerPassword">Göster</button>
          </div>
        </div>
        <div class="row">
          <button id="saveWorkerBtn" type="button">Eleman Ekle</button>
          <button id="cancelWorkerEdit" type="button" class="secondary hidden">İptal</button>
        </div>
        <p class="muted mt-8">Not: Admin kullanıcısı silinemez.</p>
        <div id="workersList" class="list mt-14"></div>
      </div>

      <div id="settingsTab" class="card tab-panel hidden">
        <h2>Ayarlar</h2>
        <h3>Admin Şifresi Değiştir</h3>
        <div class="field">
          <label for="currentAdminPassword">Mevcut Şifre</label>
          <div class="password-wrap">
            <input id="currentAdminPassword" type="password" autocomplete="current-password" />
            <button type="button" class="toggle-pass" data-target="currentAdminPassword">Göster</button>
          </div>
        </div>
        <div class="field">
          <label for="newAdminPassword">Yeni Şifre</label>
          <div class="password-wrap">
            <input id="newAdminPassword" type="password" autocomplete="new-password" />
            <button type="button" class="toggle-pass" data-target="newAdminPassword">Göster</button>
          </div>
        </div>
        <div class="field">
          <label for="confirmAdminPassword">Yeni Şifre (Tekrar)</label>
          <div class="password-wrap">
            <input id="confirmAdminPassword" type="password" autocomplete="new-password" />
            <button type="button" class="toggle-pass" data-target="confirmAdminPassword">Göster</button>
          </div>
        </div>
        <button id="changeAdminPasswordBtn" type="button">Şifreyi Güncelle</button>
      </div>
    </div>
  </section>

  <!-- WORKER VIEW -->
  <section id="workerView" class="hidden">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-icon">🛗</span>
        <div>
          <div class="topbar-title">Ufuk Bakım</div>
          <div class="topbar-sub" id="workerWelcome"></div>
        </div>
      </div>
      <button id="logoutWorker" class="topbar-btn" type="button">Çıkış</button>
    </div>

    <div class="container">
      <!-- Search box (always visible in worker panel) -->
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="buildingSearch" type="search" placeholder="Bina adı veya adres ara..." autocomplete="off" />
        <button type="button" class="search-clear hidden" id="searchClearBtn" aria-label="Aramayı temizle">✕</button>
      </div>

      <!-- Search results panel -->
      <div id="searchResultsPanel" class="hidden">
        <div id="searchResultsList"></div>
      </div>

      <!-- Groups panel -->
      <div id="workerGroupsPanel">
        <div id="workerGroupsList" class="group-grid"></div>
      </div>

      <!-- Buildings panel (when a group is selected) -->
      <div id="workerBuildingsPanel" class="hidden">
        <div class="back-row">
          <button id="backToGroupsBtn" class="secondary back-btn" type="button">← Geri</button>
          <span id="workerSelectedGroup" class="pill back-pill"></span>
        </div>
        <div id="workerBuildingsList"></div>
      </div>
    </div>
  </section>

  <script>
    const STORAGE_KEY = "asansorBakimData_v1";

    const state = {
      data: null,
      currentUser: null,
      editGroupId: null,
      editBuildingId: null,
      editWorkerId: null,
      selectedWorkerGroupId: null
    };

    let idCounter = 0;
    const uid = () => {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      idCounter += 1;
      return `${Date.now().toString(36)}-${idCounter.toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    };

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state.data = JSON.parse(raw);
        return;
      }

      const g1 = { id: uid(), name: "1. Bölge" };
      const g2 = { id: uid(), name: "2. Bölge" };

      state.data = {
        admin: { username: "admin", password: "admin123", fullName: "Patron" },
        groups: [g1, g2],
        buildings: [
          { id: uid(), groupId: g1.id, name: "Mavi Konak", address: "Caferağa Mah. Moda Cad. No:22 Kadıköy/İstanbul" },
          { id: uid(), groupId: g1.id, name: "Yıldız Apartmanı", address: "Koşuyolu Mah. Lambacı Sok. No:14 Kadıköy/İstanbul" },
          { id: uid(), groupId: g2.id, name: "İnci Plaza", address: "Mecidiyeköy Mah. Büyükdere Cad. No:91 Şişli/İstanbul" },
          { id: uid(), groupId: g2.id, name: "Güneş Sitesi", address: "Gayrettepe Mah. Yıldız Posta Cad. No:37 Beşiktaş/İstanbul" },
          { id: uid(), groupId: g2.id, name: "Sahil Apart", address: "Muratreis Mah. Cumhuriyet Cad. No:58 Üsküdar/İstanbul" }
        ],
        workers: [
          { id: uid(), fullName: "Örnek Eleman", username: "eleman1", password: "1234" }
        ]
      };

      saveData();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    }

    function $(id) { return document.getElementById(id); }

    function clearInputs(...ids) {
      ids.forEach((id) => { $(id).value = ""; });
    }

    function show(viewId) {
      ["loginView", "adminView", "workerView"].forEach((id) => $(id).classList.add("hidden"));
      $(viewId).classList.remove("hidden");
    }

    function buildActionButton(text, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = text;
      if (className) button.className = className;
      button.addEventListener("click", onClick);
      return button;
    }

    function mapsUrl(address) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
    }

    /* ── Building card builder (shared between search results and group view) ── */
    function buildBuildingCard(building, groupName, showGroupPill) {
      const card = document.createElement("div");
      card.className = "building-card";

      const header = document.createElement("div");
      header.className = "building-card-header";

      const nameEl = document.createElement("div");
      nameEl.className = "building-card-name";
      nameEl.textContent = `🏢 ${building.name}`;

      header.appendChild(nameEl);

      if (showGroupPill && groupName) {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = groupName;
        header.appendChild(pill);
      }

      const addrEl = document.createElement("div");
      addrEl.className = "building-card-addr";
      addrEl.innerHTML = `<span class="building-card-addr-icon">📍</span><span>${building.address}</span>`;

      const mapBtn = buildActionButton("🗺️ Haritada Aç", "btn-success", () => {
        window.open(mapsUrl(building.address), "_blank", "noopener");
      });

      card.append(header, addrEl, mapBtn);
      return card;
    }

    /* ── Search ──────────────────────────────────────────────────────────────── */
    function handleSearch() {
      const query = $("buildingSearch").value.trim().toLowerCase();
      const clearBtn = $("searchClearBtn");

      clearBtn.classList.toggle("hidden", query === "");

      if (query === "") {
        $("searchResultsPanel").classList.add("hidden");
        $("workerGroupsPanel").classList.remove("hidden");
        $("workerBuildingsPanel").classList.add("hidden");
        state.selectedWorkerGroupId = null;
        return;
      }

      $("workerGroupsPanel").classList.add("hidden");
      $("workerBuildingsPanel").classList.add("hidden");
      $("searchResultsPanel").classList.remove("hidden");

      const matches = state.data.buildings.filter((b) =>
        b.name.toLowerCase().includes(query) || b.address.toLowerCase().includes(query)
      );

      const wrap = $("searchResultsList");
      wrap.innerHTML = "";

      if (matches.length === 0) {
        const msg = document.createElement("div");
        msg.className = "no-results";
        msg.textContent = "Bina bulunamadı 🔍";
        wrap.appendChild(msg);
        return;
      }

      matches.forEach((building) => {
        const group = state.data.groups.find((g) => g.id === building.groupId);
        wrap.appendChild(buildBuildingCard(building, group ? group.name : null, true));
      });
    }

    function clearSearch() {
      $("buildingSearch").value = "";
      $("searchClearBtn").classList.add("hidden");
      $("searchResultsPanel").classList.add("hidden");
      $("workerGroupsPanel").classList.remove("hidden");
      $("workerBuildingsPanel").classList.add("hidden");
      state.selectedWorkerGroupId = null;
    }

    /* ── Render ──────────────────────────────────────────────────────────────── */
    function renderGroupSelects() {
      const groupSelect = $("buildingGroup");
      const filterSelect = $("buildingFilter");
      const prevGroup = groupSelect.value;
      const prevFilter = filterSelect.value;

      groupSelect.innerHTML = "";
      filterSelect.innerHTML = "";

      const filterAll = document.createElement("option");
      filterAll.value = "all";
      filterAll.textContent = "Tüm Gruplar";
      filterSelect.appendChild(filterAll);

      state.data.groups.forEach((group) => {
        const opt1 = document.createElement("option");
        opt1.value = group.id;
        opt1.textContent = group.name;
        groupSelect.appendChild(opt1);

        const opt2 = document.createElement("option");
        opt2.value = group.id;
        opt2.textContent = group.name;
        filterSelect.appendChild(opt2);
      });

      if (state.data.groups.length === 0) {
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Önce grup ekleyin";
        groupSelect.appendChild(empty);
      }

      groupSelect.value = Array.from(groupSelect.options).some((o) => o.value === prevGroup) ? prevGroup : groupSelect.value;
      filterSelect.value = Array.from(filterSelect.options).some((o) => o.value === prevFilter) ? prevFilter : "all";
    }

    function renderGroups() {
      const wrap = $("groupsList");
      wrap.innerHTML = "";

      if (state.data.groups.length === 0) {
        const empty = document.createElement("div");
        empty.className = "item muted";
        empty.textContent = "Henüz grup yok.";
        wrap.appendChild(empty);
        return;
      }

      state.data.groups.forEach((group) => {
        const buildingCount = state.data.buildings.filter((b) => b.groupId === group.id).length;
        const item = document.createElement("div");
        item.className = "item";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = group.name;

        const subtitle = document.createElement("p");
        subtitle.className = "muted";
        subtitle.textContent = `${buildingCount} bina`;

        const row = document.createElement("div");
        row.className = "row mt-8";
        row.appendChild(buildActionButton("Düzenle", "btn-edit", () => startEditGroup(group.id)));
        row.appendChild(buildActionButton("Sil", "danger", () => deleteGroup(group.id)));

        item.append(title, subtitle, row);
        wrap.appendChild(item);
      });
    }

    function renderBuildings() {
      renderGroupSelects();
      const wrap = $("buildingsList");
      wrap.innerHTML = "";

      const filter = $("buildingFilter").value;
      const buildings = state.data.buildings.filter((b) => filter === "all" || b.groupId === filter);

      if (buildings.length === 0) {
        const empty = document.createElement("div");
        empty.className = "item muted";
        empty.textContent = "Bu filtrede bina yok.";
        wrap.appendChild(empty);
        return;
      }

      buildings.forEach((building) => {
        const group = state.data.groups.find((g) => g.id === building.groupId);
        const item = document.createElement("div");
        item.className = "item";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = building.name;

        const addr = document.createElement("p");
        addr.textContent = `📍 ${building.address}`;

        const grp = document.createElement("p");
        grp.className = "muted mt-4";
        grp.textContent = `Grup: ${group ? group.name : "-"}`;

        const row = document.createElement("div");
        row.className = "row mt-8";
        row.appendChild(buildActionButton("Haritada Aç", "secondary", () => window.open(mapsUrl(building.address), "_blank", "noopener")));
        row.appendChild(buildActionButton("Düzenle", "btn-edit", () => startEditBuilding(building.id)));
        row.appendChild(buildActionButton("Sil", "danger", () => deleteBuilding(building.id)));

        item.append(title, addr, grp, row);
        wrap.appendChild(item);
      });
    }

    function renderWorkers() {
      const wrap = $("workersList");
      wrap.innerHTML = "";

      if (state.data.workers.length === 0) {
        const empty = document.createElement("div");
        empty.className = "item muted";
        empty.textContent = "Henüz eleman yok.";
        wrap.appendChild(empty);
        return;
      }

      state.data.workers.forEach((worker) => {
        const item = document.createElement("div");
        item.className = "item";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = worker.fullName;

        const user = document.createElement("p");
        user.className = "muted";
        user.textContent = `Kullanıcı adı: ${worker.username}`;

        const row = document.createElement("div");
        row.className = "row mt-8";
        row.appendChild(buildActionButton("Düzenle", "btn-edit", () => startEditWorker(worker.id)));
        row.appendChild(buildActionButton("Sil", "danger", () => deleteWorker(worker.id)));

        item.append(title, user, row);
        wrap.appendChild(item);
      });
    }

    function renderWorkerGroups() {
      const wrap = $("workerGroupsList");
      wrap.innerHTML = "";

      if (state.data.groups.length === 0) {
        const empty = document.createElement("div");
        empty.className = "muted no-results";
        empty.textContent = "Gösterilecek grup yok.";
        wrap.appendChild(empty);
        return;
      }

      state.data.groups.forEach((group) => {
        const count = state.data.buildings.filter((b) => b.groupId === group.id).length;
        const card = document.createElement("div");
        card.className = "group-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.innerHTML = `
          <div class="group-card-icon">🏢</div>
          <div class="group-card-name">${group.name}</div>
          <div class="group-card-count">${count} bina</div>
        `;
        card.addEventListener("click", () => openWorkerGroup(group.id));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openWorkerGroup(group.id);
          }
        });
        wrap.appendChild(card);
      });
    }

    function renderWorkerBuildings(groupId) {
      const group = state.data.groups.find((g) => g.id === groupId);
      $("workerSelectedGroup").textContent = group ? group.name : "";
      const wrap = $("workerBuildingsList");
      wrap.innerHTML = "";

      const buildings = state.data.buildings.filter((b) => b.groupId === groupId);
      if (buildings.length === 0) {
        const empty = document.createElement("div");
        empty.className = "no-results";
        empty.textContent = "Bu grupta bina yok.";
        wrap.appendChild(empty);
        return;
      }

      buildings.forEach((building) => {
        wrap.appendChild(buildBuildingCard(building, null, false));
      });
    }

    function refreshAdminUI() {
      renderGroups();
      renderBuildings();
      renderWorkers();
    }

    function setTab(tabId) {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabId);
      });
      document.querySelectorAll(".tab-panel").forEach((panel) => {
        panel.classList.toggle("hidden", panel.id !== tabId);
      });
    }

    /* ── Auth ────────────────────────────────────────────────────────────────── */
    function login() {
      const username = $("loginUsername").value.trim();
      const password = $("loginPassword").value;
      const errorBox = $("loginError");
      errorBox.classList.add("hidden");

      if (!username || !password) {
        errorBox.textContent = "Kullanıcı adı ve şifre zorunludur.";
        errorBox.classList.remove("hidden");
        return;
      }

      if (username === state.data.admin.username && password === state.data.admin.password) {
        state.currentUser = { role: "admin", username, fullName: state.data.admin.fullName };
        clearInputs("loginUsername", "loginPassword");
        show("adminView");
        setTab("groupsTab");
        refreshAdminUI();
        return;
      }

      const worker = state.data.workers.find((w) => w.username === username && w.password === password);
      if (worker) {
        state.currentUser = { role: "worker", id: worker.id, username: worker.username, fullName: worker.fullName };
        clearInputs("loginUsername", "loginPassword");
        $("workerWelcome").textContent = `Hoşgeldin, ${worker.fullName}`;
        clearSearch();
        renderWorkerGroups();
        show("workerView");
        return;
      }

      errorBox.textContent = "Kullanıcı adı veya şifre hatalı.";
      errorBox.classList.remove("hidden");
    }

    function logout() {
      state.currentUser = null;
      state.selectedWorkerGroupId = null;
      show("loginView");
    }

    /* ── Group CRUD ──────────────────────────────────────────────────────────── */
    function startEditGroup(id) {
      const group = state.data.groups.find((g) => g.id === id);
      if (!group) return;
      state.editGroupId = id;
      $("groupName").value = group.name;
      $("saveGroupBtn").textContent = "Grubu Güncelle";
      $("cancelGroupEdit").classList.remove("hidden");
    }

    function cancelEditGroup() {
      state.editGroupId = null;
      $("groupName").value = "";
      $("saveGroupBtn").textContent = "Grup Ekle";
      $("cancelGroupEdit").classList.add("hidden");
    }

    function saveGroup() {
      const name = $("groupName").value.trim();
      if (!name) return alert("Grup adı zorunludur.");

      const duplicate = state.data.groups.find((g) => g.name.toLowerCase() === name.toLowerCase() && g.id !== state.editGroupId);
      if (duplicate) return alert("Bu grup adı zaten var.");

      if (state.editGroupId) {
        const group = state.data.groups.find((g) => g.id === state.editGroupId);
        if (group) group.name = name;
      } else {
        state.data.groups.push({ id: uid(), name });
      }

      saveData();
      cancelEditGroup();
      refreshAdminUI();
      renderWorkerGroups();
    }

    function deleteGroup(id) {
      const group = state.data.groups.find((g) => g.id === id);
      if (!group) return;

      const buildingCount = state.data.buildings.filter((b) => b.groupId === id).length;
      const confirmed = confirm(`"${group.name}" grubu silinsin mi?\nBu işlem geri alınamaz.\nBu gruptaki ${buildingCount} bina da silinecek.`);
      if (!confirmed) return;

      state.data.groups = state.data.groups.filter((g) => g.id !== id);
      state.data.buildings = state.data.buildings.filter((b) => b.groupId !== id);

      if (state.selectedWorkerGroupId === id) {
        $("workerGroupsPanel").classList.remove("hidden");
        $("workerBuildingsPanel").classList.add("hidden");
        state.selectedWorkerGroupId = null;
      }

      saveData();
      refreshAdminUI();
      renderWorkerGroups();
    }

    /* ── Building CRUD ───────────────────────────────────────────────────────── */
    function startEditBuilding(id) {
      const b = state.data.buildings.find((x) => x.id === id);
      if (!b) return;
      state.editBuildingId = id;
      $("buildingName").value = b.name;
      $("buildingAddress").value = b.address;
      $("buildingGroup").value = b.groupId;
      $("saveBuildingBtn").textContent = "Binayı Güncelle";
      $("cancelBuildingEdit").classList.remove("hidden");
    }

    function cancelEditBuilding() {
      state.editBuildingId = null;
      clearInputs("buildingName", "buildingAddress");
      $("saveBuildingBtn").textContent = "Bina Ekle";
      $("cancelBuildingEdit").classList.add("hidden");
    }

    function saveBuilding() {
      const name = $("buildingName").value.trim();
      const address = $("buildingAddress").value.trim();
      const groupId = $("buildingGroup").value;

      if (!name || !address || !groupId) return alert("Bina adı, adres ve grup zorunludur.");
      if (!state.data.groups.find((g) => g.id === groupId)) return alert("Geçerli bir grup seçin.");

      if (state.editBuildingId) {
        const b = state.data.buildings.find((x) => x.id === state.editBuildingId);
        if (b) {
          b.name = name;
          b.address = address;
          b.groupId = groupId;
        }
      } else {
        state.data.buildings.push({ id: uid(), name, address, groupId });
      }

      saveData();
      cancelEditBuilding();
      refreshAdminUI();
      renderWorkerGroups();
      if (state.selectedWorkerGroupId) renderWorkerBuildings(state.selectedWorkerGroupId);
    }

    function deleteBuilding(id) {
      const b = state.data.buildings.find((x) => x.id === id);
      if (!b) return;
      if (!confirm(`"${b.name}" binası silinsin mi?`)) return;
      state.data.buildings = state.data.buildings.filter((x) => x.id !== id);
      saveData();
      refreshAdminUI();
      renderWorkerGroups();
      if (state.selectedWorkerGroupId) renderWorkerBuildings(state.selectedWorkerGroupId);
    }

    /* ── Worker CRUD ─────────────────────────────────────────────────────────── */
    function startEditWorker(id) {
      const w = state.data.workers.find((x) => x.id === id);
      if (!w) return;
      state.editWorkerId = id;
      $("workerName").value = w.fullName;
      $("workerUsername").value = w.username;
      $("workerPassword").value = w.password;
      $("saveWorkerBtn").textContent = "Elemanı Güncelle";
      $("cancelWorkerEdit").classList.remove("hidden");
    }

    function cancelEditWorker() {
      state.editWorkerId = null;
      clearInputs("workerName", "workerUsername", "workerPassword");
      $("saveWorkerBtn").textContent = "Eleman Ekle";
      $("cancelWorkerEdit").classList.add("hidden");
    }

    function isUsernameTaken(username, excludeWorkerId = null) {
      if (username === state.data.admin.username) return true;
      return state.data.workers.some((w) => w.username === username && w.id !== excludeWorkerId);
    }

    function saveWorker() {
      const fullName = $("workerName").value.trim();
      const username = $("workerUsername").value.trim();
      const password = $("workerPassword").value;

      if (!fullName || !username || !password) return alert("Ad soyad, kullanıcı adı ve şifre zorunludur.");
      if (isUsernameTaken(username, state.editWorkerId)) return alert("Bu kullanıcı adı zaten kullanılıyor.");

      if (state.editWorkerId) {
        const w = state.data.workers.find((x) => x.id === state.editWorkerId);
        if (w) {
          w.fullName = fullName;
          w.username = username;
          w.password = password;
        }
      } else {
        state.data.workers.push({ id: uid(), fullName, username, password });
      }

      saveData();
      cancelEditWorker();
      refreshAdminUI();
    }

    function deleteWorker(id) {
      const w = state.data.workers.find((x) => x.id === id);
      if (!w) return;
      if (!confirm(`${w.fullName} silinsin mi?`)) return;
      state.data.workers = state.data.workers.filter((x) => x.id !== id);
      saveData();
      refreshAdminUI();
    }

    /* ── Settings ────────────────────────────────────────────────────────────── */
    function changeAdminPassword() {
      const current = $("currentAdminPassword").value;
      const next = $("newAdminPassword").value;
      const confirmNext = $("confirmAdminPassword").value;

      if (!current || !next || !confirmNext) return alert("Tüm alanları doldurun.");
      if (current !== state.data.admin.password) return alert("Mevcut şifre yanlış.");
      if (next.length < 4) return alert("Yeni şifre en az 4 karakter olmalı.");
      if (next !== confirmNext) return alert("Yeni şifreler eşleşmiyor.");

      state.data.admin.password = next;
      saveData();
      clearInputs("currentAdminPassword", "newAdminPassword", "confirmAdminPassword");
      alert("Admin şifresi güncellendi.");
    }

    /* ── Worker nav ──────────────────────────────────────────────────────────── */
    function openWorkerGroup(groupId) {
      state.selectedWorkerGroupId = groupId;
      renderWorkerBuildings(groupId);
      $("workerGroupsPanel").classList.add("hidden");
      $("workerBuildingsPanel").classList.remove("hidden");
      $("searchResultsPanel").classList.add("hidden");
    }

    function backToGroups() {
      state.selectedWorkerGroupId = null;
      $("workerGroupsPanel").classList.remove("hidden");
      $("workerBuildingsPanel").classList.add("hidden");
      if ($("buildingSearch").value.trim()) {
        handleSearch();
      }
    }

    /* ── Events ──────────────────────────────────────────────────────────────── */
    function bindEvents() {
      $("loginBtn").addEventListener("click", login);
      $("logoutAdmin").addEventListener("click", logout);
      $("logoutWorker").addEventListener("click", logout);
      $("saveGroupBtn").addEventListener("click", saveGroup);
      $("cancelGroupEdit").addEventListener("click", cancelEditGroup);
      $("saveBuildingBtn").addEventListener("click", saveBuilding);
      $("cancelBuildingEdit").addEventListener("click", cancelEditBuilding);
      $("buildingFilter").addEventListener("change", renderBuildings);
      $("saveWorkerBtn").addEventListener("click", saveWorker);
      $("cancelWorkerEdit").addEventListener("click", cancelEditWorker);
      $("changeAdminPasswordBtn").addEventListener("click", changeAdminPassword);
      $("backToGroupsBtn").addEventListener("click", backToGroups);
      $("buildingSearch").addEventListener("input", handleSearch);
      $("searchClearBtn").addEventListener("click", clearSearch);

      $("loginPassword").addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => setTab(btn.dataset.tab));
      });

      document.querySelectorAll(".toggle-pass").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = $(btn.dataset.target);
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          btn.textContent = isPassword ? "Gizle" : "Göster";
        });
      });
    }

    function init() {
      loadData();
      bindEvents();
      renderGroupSelects();
      show("loginView");
    }

    init();
  </script>
</body>
</html>
