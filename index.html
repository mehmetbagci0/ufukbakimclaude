<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ufuk Asansör - Bakım Takip</title>
  <style>
    :root {
      --primary: #1B2B5E;
      --accent: #E8112D;
      --bg: #F4F6FB;
      --card: #FFFFFF;
      --text: #1f2a44;
      --muted: #6b7280;
      --border: #d8dfef;
      --success: #1f9d55;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(27, 43, 94, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      min-height: 100dvh;
    }

    .hidden { display: none !important; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      border-bottom: 2px solid var(--primary);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .logo-square {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
    }

    .logo-square .n2 { font-size: 18px; letter-spacing: .5px; }
    .logo-square .uf { font-size: 11px; letter-spacing: 1.4px; margin-top: 3px; }

    .logo-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .logo-text .ufuk { color: var(--primary); }
    .logo-text .asansor { color: var(--accent); }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 12px;
    }

    .section-title { font-size: 18px; margin-bottom: 10px; color: var(--primary); }

    .field { margin-bottom: 10px; }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    select {
      font-size: 16px;
      font-weight: 500;
      background-image: linear-gradient(45deg, transparent 50%, var(--primary) 50%), linear-gradient(135deg, var(--primary) 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      appearance: none;
      padding-right: 34px;
    }

    textarea { min-height: 90px; resize: vertical; }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(27, 43, 94, 0.15);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      min-height: 48px;
      border-radius: 10px;
      border: 1px solid transparent;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 130px;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #132148; }

    .btn-danger { background: var(--accent); color: #fff; }
    .btn-danger:hover { background: #bf0d25; }

    .btn-edit {
      background: #fff;
      color: #4b5563;
      border-color: #9ca3af;
    }

    .btn-edit:hover { background: #f9fafb; }

    .btn-link {
      background: #fff;
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-login {
      width: 100%;
      margin-top: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
    }

    .btn-login:hover { background: #bf0d25; }

    .header-right { display: flex; gap: 8px; align-items: center; }

    .logout-btn {
      min-height: 44px;
      padding: 8px 12px;
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      width: auto;
      flex: 0 0 auto;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tab-btn {
      min-height: 44px;
      background: var(--primary);
      color: #fff;
      border: 0;
      border-bottom: 3px solid transparent;
      flex: 1 1 110px;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--border);
      border-bottom: 3px solid var(--accent);
    }

    .muted { color: var(--muted); font-size: 13px; }

    .item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      background: #fff;
    }

    .item .title { font-weight: 700; font-size: 16px; color: var(--primary); }

    .empty {
      text-align: center;
      padding: 24px 10px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    .empty .icon { font-size: 26px; margin-bottom: 6px; display: block; }

    #loginView {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .login-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      text-align: center;
    }

    .login-msg { color: var(--muted); font-size: 14px; }

    .password-wrap { display: flex; gap: 8px; }
    .password-wrap input { flex: 1; }
    .toggle-pass {
      min-height: 48px;
      width: auto;
      flex: 0 0 auto;
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 10px 12px;
    }

    .toolbar-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 680px) {
      .toolbar-grid { grid-template-columns: 1fr 1fr; }
      .split-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    }

    .group-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 620px) {
      .group-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .group-card {
      border: 1px solid var(--border);
      border-left: 6px solid var(--primary);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 72px;
    }

    .group-card-main { display: flex; align-items: center; gap: 10px; }
    .group-card-icon { font-size: 22px; }
    .group-card-name { font-weight: 700; color: var(--primary); }

    .count-badge {
      min-width: 32px;
      height: 32px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      padding: 0 8px;
      flex: 0 0 auto;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-wrap input {
      min-height: 54px;
      padding-left: 42px;
      padding-right: 40px;
      font-size: 17px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 22px;
      width: auto;
      min-height: 40px;
      flex: 0 0 auto;
      padding: 4px 8px;
    }

    .search-result-head {
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .building-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
    }

    .building-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .building-address {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .group-pill {
      display: inline-block;
      background: #e9eefb;
      color: var(--primary);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      margin-bottom: 8px;
    }

    .back-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .toast-area {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
      pointer-events: none;
    }

    .toast {
      min-width: 220px;
      max-width: 330px;
      padding: 11px 12px;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(-8px);
      transition: .2s;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--accent); }
  </style>
</head>
<body>
  <div id="toastArea" class="toast-area" aria-live="polite" aria-atomic="true"></div>

  <section id="loginView">
    <div class="login-box">
      <div class="login-logo-wrap">
        <div class="logo" aria-label="ufuk asansör logosu">
          <div class="logo-square"><span class="n2">02</span><span class="uf">UFUK</span></div>
          <div class="logo-text"><span class="ufuk">ufuk</span> <span class="asansor">asansör</span></div>
        </div>
        <p class="login-msg">Ufuk Asansör bakım takip sistemine hoş geldiniz.</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="loginUsername">Kullanıcı Adı</label>
          <input id="loginUsername" autocomplete="username" placeholder="Kullanıcı adınız" />
        </div>
        <div class="field">
          <label for="loginPassword">Şifre</label>
          <div class="password-wrap">
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" class="toggle-pass" data-target="loginPassword">Göster</button>
          </div>
        </div>
        <button id="loginBtn" type="submit" class="btn-login">Giriş Yap</button>
      </form>
    </div>
  </section>

  <section id="adminView" class="hidden">
    <header class="app-header">
      <div class="logo" aria-label="ufuk asansör logosu">
        <div class="logo-square"><span class="n2">02</span><span class="uf">UFUK</span></div>
        <div class="logo-text"><span class="ufuk">ufuk</span> <span class="asansor">asansör</span></div>
      </div>
      <div class="header-right">
        <button id="logoutAdmin" class="logout-btn" type="button">Çıkış</button>
      </div>
    </header>

    <div class="container">
      <div class="tabs">
        <button class="tab-btn active" data-tab="groupsTab" type="button">Gruplar</button>
        <button class="tab-btn" data-tab="buildingsTab" type="button">Binalar</button>
        <button class="tab-btn" data-tab="workersTab" type="button">Elemanlar</button>
        <button class="tab-btn" data-tab="settingsTab" type="button">Ayarlar</button>
      </div>

      <div id="groupsTab" class="card tab-panel">
        <h2 class="section-title">Grup Yönetimi</h2>
        <div class="field">
          <label for="groupName">Grup Adı</label>
          <input id="groupName" placeholder="Örn: 3. Bölge" />
        </div>
        <div class="actions">
          <button id="saveGroupBtn" class="btn-primary" type="button">Grup Ekle</button>
          <button id="cancelGroupEdit" class="btn-edit hidden" type="button">İptal</button>
        </div>
        <div id="groupsList" style="margin-top:10px;"></div>
      </div>

      <div id="buildingsTab" class="card tab-panel hidden">
        <h2 class="section-title">Bina Yönetimi</h2>
        <div class="toolbar-grid">
          <div class="field">
            <label for="buildingFilter">Gruba Göre Filtre</label>
            <select id="buildingFilter"></select>
          </div>
          <div class="field">
            <label for="buildingTextFilter">Metin Ara</label>
            <input id="buildingTextFilter" placeholder="Bina adı veya adres" />
          </div>
        </div>

        <div class="split-2">
          <div class="field">
            <label for="buildingName">Bina Adı</label>
            <input id="buildingName" placeholder="Örn: Yıldız Apartmanı" />
          </div>
          <div class="field">
            <label for="buildingGroup">Grup</label>
            <select id="buildingGroup"></select>
          </div>
        </div>

        <div class="field">
          <label for="buildingAddress">Adres</label>
          <textarea id="buildingAddress" placeholder="Açık adres"></textarea>
        </div>

        <div class="actions">
          <button id="saveBuildingBtn" class="btn-primary" type="button">Bina Ekle</button>
          <button id="cancelBuildingEdit" class="btn-edit hidden" type="button">İptal</button>
        </div>
        <div id="buildingsList" style="margin-top:10px;"></div>
      </div>

      <div id="workersTab" class="card tab-panel hidden">
        <h2 class="section-title">Eleman Yönetimi</h2>
        <div class="split-2">
          <div class="field">
            <label for="workerName">Ad Soyad</label>
            <input id="workerName" placeholder="Ad Soyad" />
          </div>
          <div class="field">
            <label for="workerUsername">Kullanıcı Adı</label>
            <input id="workerUsername" placeholder="kullanici_adi" autocomplete="off" />
          </div>
        </div>
        <div class="field">
          <label for="workerPassword">Şifre</label>
          <div class="password-wrap">
            <input id="workerPassword" type="password" placeholder="Yeni şifre (düzenlemede boş bırakılabilir)" autocomplete="new-password" />
            <button type="button" class="toggle-pass" data-target="workerPassword">Göster</button>
          </div>
        </div>

        <div class="actions">
          <button id="saveWorkerBtn" class="btn-primary" type="button">Eleman Ekle</button>
          <button id="cancelWorkerEdit" class="btn-edit hidden" type="button">İptal</button>
        </div>
        <p class="muted" style="margin-top:8px;">Not: Düzenlerken şifreyi boş bırakabilirsiniz, eski şifre korunur.</p>
        <div id="workersList" style="margin-top:10px;"></div>
      </div>

      <div id="settingsTab" class="card tab-panel hidden">
        <h2 class="section-title">Admin Şifre Değiştirme</h2>
        <div class="field">
          <label for="currentAdminPassword">Mevcut Şifre</label>
          <div class="password-wrap">
            <input id="currentAdminPassword" type="password" autocomplete="current-password" />
            <button type="button" class="toggle-pass" data-target="currentAdminPassword">Göster</button>
          </div>
        </div>
        <div class="field">
          <label for="newAdminPassword">Yeni Şifre</label>
          <div class="password-wrap">
            <input id="newAdminPassword" type="password" autocomplete="new-password" />
            <button type="button" class="toggle-pass" data-target="newAdminPassword">Göster</button>
          </div>
        </div>
        <div class="field">
          <label for="confirmAdminPassword">Yeni Şifre (Tekrar)</label>
          <div class="password-wrap">
            <input id="confirmAdminPassword" type="password" autocomplete="new-password" />
            <button type="button" class="toggle-pass" data-target="confirmAdminPassword">Göster</button>
          </div>
        </div>
        <button id="changeAdminPasswordBtn" class="btn-primary" type="button">Şifreyi Güncelle</button>
      </div>
    </div>
  </section>

  <section id="workerView" class="hidden">
    <header class="app-header">
      <div class="logo" aria-label="ufuk asansör logosu">
        <div class="logo-square"><span class="n2">02</span><span class="uf">UFUK</span></div>
        <div class="logo-text"><span class="ufuk">ufuk</span> <span class="asansor">asansör</span></div>
      </div>
      <div class="header-right">
        <button id="logoutWorker" class="logout-btn" type="button">Çıkış</button>
      </div>
    </header>

    <div class="container">
      <div class="card" style="margin-bottom:12px;">
        <p id="workerWelcome" class="muted" style="font-size:14px;"></p>
      </div>

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="buildingSearch" type="search" placeholder="Bina ara..." autocomplete="off" />
        <button type="button" id="searchClearBtn" class="search-clear hidden" aria-label="Aramayı temizle">×</button>
      </div>

      <div id="searchResultsPanel" class="hidden">
        <p class="search-result-head">Arama Sonuçları</p>
        <div id="searchResultsList"></div>
      </div>

      <div id="workerGroupsPanel">
        <div id="workerGroupsList" class="group-grid"></div>
      </div>

      <div id="workerBuildingsPanel" class="hidden">
        <div class="back-wrap">
          <button id="backToGroupsBtn" class="btn-edit" type="button">← Gruplara Dön</button>
          <span id="workerSelectedGroup" class="group-pill"></span>
        </div>
        <div id="workerBuildingsList"></div>
      </div>
    </div>
  </section>

  <script>
    const STORAGE_KEY = "asansorBakimData_v1";

    const state = {
      data: null,
      currentUser: null,
      editGroupId: null,
      editBuildingId: null,
      editWorkerId: null,
      selectedWorkerGroupId: null
    };

    let idCounter = 0;

    function uid() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      idCounter += 1;
      return `${Date.now().toString(36)}-${idCounter.toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function $(id) { return document.getElementById(id); }

    function showToast(message, type = "success") {
      const area = $("toastArea");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.textContent = message;
      area.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add("show"));
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 200);
      }, 2400);
    }

    function clearInputs(...ids) {
      ids.forEach((id) => {
        const el = $(id);
        if (el) el.value = "";
      });
    }

    function mapsUrl(address) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state.data = JSON.parse(raw);
        return;
      }

      const g1 = { id: uid(), name: "1. Bölge" };
      const g2 = { id: uid(), name: "2. Bölge" };

      state.data = {
        admin: { username: "admin", password: "admin123", fullName: "Patron" },
        groups: [g1, g2],
        buildings: [
          { id: uid(), groupId: g1.id, name: "Mavi Konak", address: "Caferağa Mah. Moda Cad. No:22 Kadıköy/İstanbul" },
          { id: uid(), groupId: g1.id, name: "Yıldız Apartmanı", address: "Koşuyolu Mah. Lambacı Sok. No:14 Kadıköy/İstanbul" },
          { id: uid(), groupId: g2.id, name: "İnci Plaza", address: "Mecidiyeköy Mah. Büyükdere Cad. No:91 Şişli/İstanbul" },
          { id: uid(), groupId: g2.id, name: "Güneş Sitesi", address: "Gayrettepe Mah. Yıldız Posta Cad. No:37 Beşiktaş/İstanbul" }
        ],
        workers: [
          { id: uid(), fullName: "Örnek Eleman", username: "eleman1", password: "1234" }
        ]
      };

      saveData();
    }

    function show(viewId) {
      ["loginView", "adminView", "workerView"].forEach((id) => $(id).classList.add("hidden"));
      $(viewId).classList.remove("hidden");
    }

    function buildEmpty(text) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = `<span class="icon">📭</span>${text}`;
      return empty;
    }

    function renderGroupSelects() {
      const groupSelect = $("buildingGroup");
      const filterSelect = $("buildingFilter");
      const prevGroup = groupSelect.value;
      const prevFilter = filterSelect.value;

      groupSelect.innerHTML = "";
      filterSelect.innerHTML = "";

      const allOpt = document.createElement("option");
      allOpt.value = "all";
      allOpt.textContent = "Tüm Gruplar";
      filterSelect.appendChild(allOpt);

      state.data.groups.forEach((group) => {
        const opt1 = document.createElement("option");
        opt1.value = group.id;
        opt1.textContent = group.name;
        groupSelect.appendChild(opt1);

        const opt2 = document.createElement("option");
        opt2.value = group.id;
        opt2.textContent = group.name;
        filterSelect.appendChild(opt2);
      });

      if (!state.data.groups.length) {
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Önce grup ekleyin";
        groupSelect.appendChild(empty);
      }

      groupSelect.value = Array.from(groupSelect.options).some((o) => o.value === prevGroup) ? prevGroup : groupSelect.value;
      filterSelect.value = Array.from(filterSelect.options).some((o) => o.value === prevFilter) ? prevFilter : "all";
    }

    function buildActionButton(text, className, onClick) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = text;
      btn.className = className;
      btn.addEventListener("click", onClick);
      return btn;
    }

    function buildBuildingCard(building, groupName = "", showGroup = false) {
      const card = document.createElement("div");
      card.className = "building-card";

      const name = document.createElement("div");
      name.className = "building-name";
      name.textContent = building.name;

      const address = document.createElement("div");
      address.className = "building-address";
      address.textContent = building.address;

      card.appendChild(name);

      if (showGroup && groupName) {
        const pill = document.createElement("span");
        pill.className = "group-pill";
        pill.textContent = `Grup: ${groupName}`;
        card.appendChild(pill);
      }

      card.appendChild(address);
      card.appendChild(buildActionButton("Haritada Aç", "btn-danger", () => window.open(mapsUrl(building.address), "_blank", "noopener")));
      return card;
    }

    function renderGroups() {
      const wrap = $("groupsList");
      wrap.innerHTML = "";

      if (!state.data.groups.length) {
        wrap.appendChild(buildEmpty("Henüz kayıt yok"));
        return;
      }

      state.data.groups.forEach((group) => {
        const count = state.data.buildings.filter((b) => b.groupId === group.id).length;
        const item = document.createElement("div");
        item.className = "item";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = group.name;

        const sub = document.createElement("p");
        sub.className = "muted";
        sub.textContent = `${count} bina`;

        const actions = document.createElement("div");
        actions.className = "actions";
        actions.appendChild(buildActionButton("Düzenle", "btn-edit", () => startEditGroup(group.id)));
        actions.appendChild(buildActionButton("Sil", "btn-danger", () => deleteGroup(group.id)));

        item.append(title, sub, actions);
        wrap.appendChild(item);
      });
    }

    function renderBuildings() {
      renderGroupSelects();

      const wrap = $("buildingsList");
      wrap.innerHTML = "";
      const groupFilter = $("buildingFilter").value;
      const textFilter = $("buildingTextFilter").value.trim().toLowerCase();

      const buildings = state.data.buildings.filter((b) => {
        const passGroup = groupFilter === "all" || b.groupId === groupFilter;
        const passText = !textFilter || b.name.toLowerCase().includes(textFilter) || b.address.toLowerCase().includes(textFilter);
        return passGroup && passText;
      });

      if (!buildings.length) {
        wrap.appendChild(buildEmpty("Henüz kayıt yok"));
        return;
      }

      buildings.forEach((building) => {
        const group = state.data.groups.find((g) => g.id === building.groupId);
        const item = document.createElement("div");
        item.className = "item";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = building.name;

        const addr = document.createElement("p");
        addr.className = "muted";
        addr.textContent = building.address;

        const grp = document.createElement("p");
        grp.className = "muted";
        grp.style.marginTop = "4px";
        grp.textContent = `Grup: ${group ? group.name : "-"}`;

        const actions = document.createElement("div");
        actions.className = "actions";
        actions.appendChild(buildActionButton("Haritada Aç", "btn-danger", () => window.open(mapsUrl(building.address), "_blank", "noopener")));
        actions.appendChild(buildActionButton("Düzenle", "btn-edit", () => startEditBuilding(building.id)));
        actions.appendChild(buildActionButton("Sil", "btn-danger", () => deleteBuilding(building.id)));

        item.append(title, addr, grp, actions);
        wrap.appendChild(item);
      });
    }

    function renderWorkers() {
      const wrap = $("workersList");
      wrap.innerHTML = "";

      if (!state.data.workers.length) {
        wrap.appendChild(buildEmpty("Henüz kayıt yok"));
        return;
      }

      state.data.workers.forEach((worker) => {
        const item = document.createElement("div");
        item.className = "item";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = worker.fullName;

        const user = document.createElement("p");
        user.className = "muted";
        user.textContent = `Kullanıcı adı: ${worker.username}`;

        const actions = document.createElement("div");
        actions.className = "actions";
        actions.appendChild(buildActionButton("Düzenle", "btn-edit", () => startEditWorker(worker.id)));
        actions.appendChild(buildActionButton("Sil", "btn-danger", () => deleteWorker(worker.id)));

        item.append(title, user, actions);
        wrap.appendChild(item);
      });
    }

    function renderWorkerGroups() {
      const wrap = $("workerGroupsList");
      wrap.innerHTML = "";

      if (!state.data.groups.length) {
        wrap.appendChild(buildEmpty("Henüz kayıt yok"));
        return;
      }

      state.data.groups.forEach((group) => {
        const count = state.data.buildings.filter((b) => b.groupId === group.id).length;
        const card = document.createElement("div");
        card.className = "group-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.innerHTML = `
          <div class="group-card-main">
            <span class="group-card-icon">🏢</span>
            <span class="group-card-name">${group.name}</span>
          </div>
          <span class="count-badge">${count}</span>
        `;
        card.addEventListener("click", () => openWorkerGroup(group.id));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openWorkerGroup(group.id);
          }
        });
        wrap.appendChild(card);
      });
    }

    function renderWorkerBuildings(groupId) {
      const group = state.data.groups.find((g) => g.id === groupId);
      $("workerSelectedGroup").textContent = group ? group.name : "";

      const wrap = $("workerBuildingsList");
      wrap.innerHTML = "";

      const buildings = state.data.buildings.filter((b) => b.groupId === groupId);
      if (!buildings.length) {
        wrap.appendChild(buildEmpty("Henüz kayıt yok"));
        return;
      }

      buildings.forEach((building) => wrap.appendChild(buildBuildingCard(building)));
    }

    function handleSearch() {
      const query = $("buildingSearch").value.trim().toLowerCase();
      $("searchClearBtn").classList.toggle("hidden", !query);

      if (!query) {
        $("searchResultsPanel").classList.add("hidden");
        $("workerGroupsPanel").classList.remove("hidden");
        $("workerBuildingsPanel").classList.add("hidden");
        state.selectedWorkerGroupId = null;
        return;
      }

      $("workerGroupsPanel").classList.add("hidden");
      $("workerBuildingsPanel").classList.add("hidden");
      $("searchResultsPanel").classList.remove("hidden");

      const resultWrap = $("searchResultsList");
      resultWrap.innerHTML = "";

      const matches = state.data.buildings.filter((b) => b.name.toLowerCase().includes(query) || b.address.toLowerCase().includes(query));

      if (!matches.length) {
        const noRes = document.createElement("div");
        noRes.className = "empty";
        noRes.innerHTML = `<span class="icon">🔎</span>Sonuç bulunamadı`;
        resultWrap.appendChild(noRes);
        return;
      }

      matches.forEach((building) => {
        const group = state.data.groups.find((g) => g.id === building.groupId);
        resultWrap.appendChild(buildBuildingCard(building, group ? group.name : "-", true));
      });
    }

    function clearSearch() {
      $("buildingSearch").value = "";
      state.selectedWorkerGroupId = null;
      $("searchClearBtn").classList.add("hidden");
      $("searchResultsPanel").classList.add("hidden");
      $("workerBuildingsPanel").classList.add("hidden");
      $("workerGroupsPanel").classList.remove("hidden");
    }

    function refreshAdminUI() {
      renderGroups();
      renderBuildings();
      renderWorkers();
    }

    function resetGroupForm() {
      state.editGroupId = null;
      $("groupName").value = "";
      $("saveGroupBtn").textContent = "Grup Ekle";
      $("cancelGroupEdit").classList.add("hidden");
    }

    function resetBuildingForm() {
      state.editBuildingId = null;
      clearInputs("buildingName", "buildingAddress");
      $("saveBuildingBtn").textContent = "Bina Ekle";
      $("cancelBuildingEdit").classList.add("hidden");
    }

    function resetWorkerForm() {
      state.editWorkerId = null;
      clearInputs("workerName", "workerUsername", "workerPassword");
      $("saveWorkerBtn").textContent = "Eleman Ekle";
      $("cancelWorkerEdit").classList.add("hidden");
    }

    function resetSettingsForm() {
      clearInputs("currentAdminPassword", "newAdminPassword", "confirmAdminPassword");
    }

    function resetAdminForms() {
      resetGroupForm();
      resetBuildingForm();
      resetWorkerForm();
      resetSettingsForm();
    }

    function setTab(tabId) {
      resetAdminForms();
      document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === tabId));
      document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.toggle("hidden", panel.id !== tabId));
    }

    function login() {
      const username = $("loginUsername").value.trim();
      const password = $("loginPassword").value;

      if (!username || !password) {
        showToast("Kullanıcı adı ve şifre zorunludur.", "error");
        return;
      }

      if (username === state.data.admin.username && password === state.data.admin.password) {
        state.currentUser = { role: "admin", username, fullName: state.data.admin.fullName };
        clearInputs("loginUsername", "loginPassword");
        refreshAdminUI();
        setTab("groupsTab");
        show("adminView");
        showToast("Admin girişi başarılı.", "success");
        return;
      }

      const worker = state.data.workers.find((w) => w.username === username && w.password === password);
      if (worker) {
        state.currentUser = { role: "worker", id: worker.id, username: worker.username, fullName: worker.fullName };
        clearInputs("loginUsername", "loginPassword");
        $("workerWelcome").textContent = `Hoş geldin, ${worker.fullName}`;
        renderWorkerGroups();
        clearSearch();
        show("workerView");
        showToast("Giriş başarılı.", "success");
        return;
      }

      showToast("Kullanıcı adı veya şifre hatalı.", "error");
    }

    function logout() {
      state.currentUser = null;
      state.selectedWorkerGroupId = null;
      clearSearch();
      show("loginView");
    }

    function startEditGroup(id) {
      const group = state.data.groups.find((g) => g.id === id);
      if (!group) return;
      state.editGroupId = id;
      $("groupName").value = group.name;
      $("saveGroupBtn").textContent = "Grubu Güncelle";
      $("cancelGroupEdit").classList.remove("hidden");
    }

    function saveGroup() {
      const name = $("groupName").value.trim();
      if (!name) {
        showToast("Grup adı zorunludur.", "error");
        return;
      }

      const duplicate = state.data.groups.find((g) => g.name.toLowerCase() === name.toLowerCase() && g.id !== state.editGroupId);
      if (duplicate) {
        showToast("Bu grup adı zaten var.", "error");
        return;
      }

      if (state.editGroupId) {
        const g = state.data.groups.find((x) => x.id === state.editGroupId);
        if (g) g.name = name;
        showToast("Grup güncellendi.", "success");
      } else {
        state.data.groups.push({ id: uid(), name });
        showToast("Grup eklendi.", "success");
      }

      saveData();
      resetGroupForm();
      refreshAdminUI();
      renderWorkerGroups();
    }

    function deleteGroup(id) {
      const group = state.data.groups.find((g) => g.id === id);
      if (!group) return;
      if (!confirm(`"${group.name}" grubu silinsin mi? Bu gruptaki binalar da silinecek.`)) return;

      state.data.groups = state.data.groups.filter((g) => g.id !== id);
      state.data.buildings = state.data.buildings.filter((b) => b.groupId !== id);
      if (state.selectedWorkerGroupId === id) state.selectedWorkerGroupId = null;

      saveData();
      refreshAdminUI();
      renderWorkerGroups();
      clearSearch();
      showToast("Grup ve bağlı binalar silindi.", "success");
    }

    function startEditBuilding(id) {
      const building = state.data.buildings.find((b) => b.id === id);
      if (!building) return;

      state.editBuildingId = id;
      $("buildingName").value = building.name;
      $("buildingAddress").value = building.address;
      $("buildingGroup").value = building.groupId;
      $("saveBuildingBtn").textContent = "Binayı Güncelle";
      $("cancelBuildingEdit").classList.remove("hidden");
    }

    function saveBuilding() {
      const name = $("buildingName").value.trim();
      const address = $("buildingAddress").value.trim();
      const groupId = $("buildingGroup").value;

      if (!name || !address || !groupId) {
        showToast("Bina adı, adres ve grup zorunludur.", "error");
        return;
      }

      if (!state.data.groups.find((g) => g.id === groupId)) {
        showToast("Geçerli bir grup seçin.", "error");
        return;
      }

      if (state.editBuildingId) {
        const b = state.data.buildings.find((x) => x.id === state.editBuildingId);
        if (b) {
          b.name = name;
          b.address = address;
          b.groupId = groupId;
        }
        showToast("Bina güncellendi.", "success");
      } else {
        state.data.buildings.push({ id: uid(), name, address, groupId });
        showToast("Bina eklendi.", "success");
      }

      saveData();
      resetBuildingForm();
      refreshAdminUI();
      renderWorkerGroups();
      if (state.selectedWorkerGroupId) renderWorkerBuildings(state.selectedWorkerGroupId);
      handleSearch();
    }

    function deleteBuilding(id) {
      const building = state.data.buildings.find((b) => b.id === id);
      if (!building) return;
      if (!confirm(`"${building.name}" binası silinsin mi?`)) return;

      state.data.buildings = state.data.buildings.filter((b) => b.id !== id);
      saveData();
      refreshAdminUI();
      renderWorkerGroups();
      if (state.selectedWorkerGroupId) renderWorkerBuildings(state.selectedWorkerGroupId);
      handleSearch();
      showToast("Bina silindi.", "success");
    }

    function startEditWorker(id) {
      const worker = state.data.workers.find((w) => w.id === id);
      if (!worker) return;

      state.editWorkerId = id;
      $("workerName").value = worker.fullName;
      $("workerUsername").value = worker.username;
      $("workerPassword").value = "";
      $("saveWorkerBtn").textContent = "Elemanı Güncelle";
      $("cancelWorkerEdit").classList.remove("hidden");
    }

    function isUsernameTaken(username, excludeId = null) {
      if (username === state.data.admin.username) return true;
      return state.data.workers.some((w) => w.username === username && w.id !== excludeId);
    }

    function saveWorker() {
      const fullName = $("workerName").value.trim();
      const username = $("workerUsername").value.trim();
      const password = $("workerPassword").value;

      if (!fullName || !username) {
        showToast("Ad soyad ve kullanıcı adı zorunludur.", "error");
        return;
      }

      if (!state.editWorkerId && !password) {
        showToast("Yeni eleman için şifre zorunludur.", "error");
        return;
      }

      if (isUsernameTaken(username, state.editWorkerId)) {
        showToast("Bu kullanıcı adı zaten kullanılıyor.", "error");
        return;
      }

      if (state.editWorkerId) {
        const w = state.data.workers.find((x) => x.id === state.editWorkerId);
        if (w) {
          w.fullName = fullName;
          w.username = username;
          if (password) w.password = password;
        }
        showToast("Eleman güncellendi.", "success");
      } else {
        state.data.workers.push({ id: uid(), fullName, username, password });
        showToast("Eleman eklendi.", "success");
      }

      saveData();
      resetWorkerForm();
      refreshAdminUI();
    }

    function deleteWorker(id) {
      const worker = state.data.workers.find((w) => w.id === id);
      if (!worker) return;
      if (!confirm(`${worker.fullName} silinsin mi?`)) return;

      state.data.workers = state.data.workers.filter((w) => w.id !== id);
      saveData();
      refreshAdminUI();
      showToast("Eleman silindi.", "success");
    }

    function changeAdminPassword() {
      const current = $("currentAdminPassword").value;
      const next = $("newAdminPassword").value;
      const confirmNext = $("confirmAdminPassword").value;

      if (!current || !next || !confirmNext) {
        showToast("Tüm alanları doldurun.", "error");
        return;
      }

      if (current !== state.data.admin.password) {
        showToast("Mevcut şifre yanlış.", "error");
        return;
      }

      if (next.length < 4) {
        showToast("Yeni şifre en az 4 karakter olmalı.", "error");
        return;
      }

      if (next !== confirmNext) {
        showToast("Yeni şifreler eşleşmiyor.", "error");
        return;
      }

      state.data.admin.password = next;
      saveData();
      resetSettingsForm();
      showToast("Admin şifresi güncellendi.", "success");
    }

    function openWorkerGroup(groupId) {
      state.selectedWorkerGroupId = groupId;
      renderWorkerBuildings(groupId);
      $("workerGroupsPanel").classList.add("hidden");
      $("searchResultsPanel").classList.add("hidden");
      $("workerBuildingsPanel").classList.remove("hidden");
    }

    function backToGroups() {
      state.selectedWorkerGroupId = null;
      $("workerBuildingsPanel").classList.add("hidden");
      $("workerGroupsPanel").classList.remove("hidden");
      if ($("buildingSearch").value.trim()) handleSearch();
    }

    function bindEvents() {
      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        login();
      });

      $("logoutAdmin").addEventListener("click", logout);
      $("logoutWorker").addEventListener("click", logout);

      $("saveGroupBtn").addEventListener("click", saveGroup);
      $("cancelGroupEdit").addEventListener("click", resetGroupForm);

      $("saveBuildingBtn").addEventListener("click", saveBuilding);
      $("cancelBuildingEdit").addEventListener("click", resetBuildingForm);
      $("buildingFilter").addEventListener("change", renderBuildings);
      $("buildingTextFilter").addEventListener("input", renderBuildings);

      $("saveWorkerBtn").addEventListener("click", saveWorker);
      $("cancelWorkerEdit").addEventListener("click", resetWorkerForm);

      $("changeAdminPasswordBtn").addEventListener("click", changeAdminPassword);

      $("backToGroupsBtn").addEventListener("click", backToGroups);
      $("buildingSearch").addEventListener("input", handleSearch);
      $("searchClearBtn").addEventListener("click", clearSearch);

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => setTab(btn.dataset.tab));
      });

      document.querySelectorAll(".toggle-pass").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = $(btn.dataset.target);
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          btn.textContent = isPassword ? "Gizle" : "Göster";
        });
      });
    }

    function init() {
      loadData();
      bindEvents();
      renderGroupSelects();
      show("loginView");
    }

    init();
  </script>
</body>
</html>
